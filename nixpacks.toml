# nixpacks.toml
#
# Konfigurasi build custom untuk Railway (Nixpacks) supaya binary "yt-dlp"
# ikut ke-download otomatis setiap kali project ini di-build/deploy ulang.
#
# Ini bagian dari setup "yt-dlp-rescue" -- lihat komentar panjang di
# index.js (cari "Fitur: Download media dari link") untuk penjelasan
# lengkap kenapa yt-dlp butuh di-install terpisah dari dependency npm
# project ini.
#
# CATATAN (setelah sesi debug Agustus 2026): ternyata di runtime Railway
# yang dipakai project ini, "yt-dlp" SUDAH ketemu otomatis lewat PATH
# sistem (/usr/local/bin/yt-dlp) tanpa perlu YTDLP_PATH di-set sama
# sekali -- kemungkinan environment base Node.js Railway-nya sendiri
# sudah include Python + yt-dlp. Baris curl download ke /app/yt-dlp di
# bawah TETAP dipertahankan sebagai fallback/jaga-jaga (gak ngerusak apa
# pun kalau ternyata gak kepakai), tapi kalau kamu mau extra pasti, boleh
# cek dulu lewat Railway Shell: `which yt-dlp` -- kalau ketemu di
# /usr/local/bin/yt-dlp, YTDLP_PATH gak perlu di-set di Variables sama
# sekali (biarin default "yt-dlp" bareword).
#
# Kalau ternyata di kamu /usr/local/bin/yt-dlp TIDAK ketemu (beda dari
# hasil debug kita), baru WAJIB set di Railway (tab Variables):
#
#   YTDLP_PATH = /app/yt-dlp

[phases.install]
cmds = [
  "npm ci",
  # yt-dlp_linux = binary standalone (PyInstaller build), TIDAK butuh
  # Python system terpisah -- paling aman buat container Railway yang
  # base image-nya cuma Node.js. Fallback/jaga-jaga (lihat catatan di
  # atas soal /usr/local/bin/yt-dlp).
  "curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /app/yt-dlp",
  "chmod a+rx /app/yt-dlp",
  # WAJIB: plugin PO Token provider (sisi yt-dlp). Tanpa ini, walau
  # server bgutil di service `pot-server` sudah jalan sempurna, yt-dlp
  # TIDAK akan tau cara "ngobrol" ke server itu (PO Token Providers:
  # none) -- ini akar masalah yang kita temukan lewat debug panjang.
  "pip install --break-system-packages -U bgutil-ytdlp-pot-provider"
]